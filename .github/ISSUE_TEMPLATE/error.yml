name: Informar de un error
description: Algo no funciona como debería o un resultado parece incorrecto.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si es un **fallo de seguridad de la propia herramienta**, no lo publiques aquí: usa **Security → Report a vulnerability**.
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué ha pasado?
      description: Describe el error o el resultado incorrecto y lo que esperabas.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Analizar https://ejemplo.com con «Solo esta página»
        2. Abrir el hallazgo «…»
        3. …
    validations:
      required: true
  - type: dropdown
    id: version-app
    attributes:
      label: ¿Qué versión usas?
      options:
        - App de escritorio (WebAudit-Sec.exe)
        - Versión web (python -m web)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de WebAudit Sec
      placeholder: "1.0.1"
  - type: dropdown
    id: comprobacion
    attributes:
      label: ¿En qué comprobación?
      options:
        - Cabeceras de seguridad
        - Cookies
        - TLS y certificados
        - Contenido de la página
        - DNS y correo
        - Servidor
        - Archivos expuestos
        - Rastreo del sitio
        - Exportar informes
        - Otra
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o informe exportado
      description: Si puedes, adjunta una captura o el informe en JSON. Analiza solo sitios propios o con permiso.
