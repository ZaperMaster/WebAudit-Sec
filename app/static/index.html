<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebAudit Sec | Seguridad web</title>
  <link rel="icon" type="image/png" href="/static/brand/logo-fuera.png">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<header>
  <div class="brand">
    <img class="logo-mark" src="/static/brand/logo-fuera.png" alt="">
    <div>
      <div class="logo">WebAudit <span>Sec</span></div>
      <span class="brand-caption">WEB SECURITY AUDITOR</span>
    </div>
  </div>
  <button id="language" type="button">EN / ES</button>
</header>

<main>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p id="intro"></p>

  <!-- Formulario de análisis -->
  <section class="panel">
    <form id="scanForm">
      <div class="url-field">
        <label id="urlLabel" for="target"></label>
        <input id="target" type="url" placeholder="https://example.com" required>
      </div>
      <fieldset class="crawl-options">
        <legend id="crawlMode"></legend>
        <label>
          <input type="radio" name="crawl-mode" value="single" checked>
          <span id="singlePage"></span>
        </label>
        <label>
          <input type="radio" name="crawl-mode" value="multiple">
          <span id="linkedPages"></span>
        </label>
      </fieldset>
      <button class="primary" id="scanButton" type="submit"></button>
    </form>
    <p id="notice"></p>
  </section>

  <!-- Resumen -->
  <section class="stats stats-row">
    <div class="stat"><span id="statusLabel"></span><strong id="statusValue">—</strong></div>
    <div class="stat"><span id="httpLabel"></span><strong id="httpValue">—</strong></div>
    <div class="stat"><span id="findingsLabel"></span><strong id="findingsValue">—</strong></div>
  </section>

  <section class="stats severities stats-row">
    <div class="stat"><span id="highLabel"></span><strong id="highValue">—</strong></div>
    <div class="stat"><span id="mediumLabel"></span><strong id="mediumValue">—</strong></div>
    <div class="stat"><span id="lowLabel"></span><strong id="lowValue">—</strong></div>
    <div class="stat"><span id="infoLabel"></span><strong id="infoValue">—</strong></div>
  </section>

  <!-- Todas las comprobaciones -->
  <section class="panel">
    <h2 id="checksTitle"></h2>
    <p id="checksDescription"></p>
    <div class="stats">
      <div class="stat"><span id="checksPassLabel"></span><strong id="checksPass">—</strong></div>
      <div class="stat"><span id="checksWarningLabel"></span><strong id="checksWarning">—</strong></div>
      <div class="stat"><span id="checksUnknownLabel"></span><strong id="checksUnknown">—</strong></div>
    </div>
    <div id="checksList"></div>
  </section>

  <details class="methodology">
    <summary id="severityDisclaimerLabel"></summary>
    <p id="severityDisclaimer"></p>
  </details>

  <!-- Hallazgos por página -->
  <section class="panel">
    <h2 id="resultsTitle"></h2>
    <div id="results">
      <p id="empty"></p>
    </div>
  </section>
</main>

<footer>WebAudit Sec · Auditoría de seguridad web · 1.0</footer>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
