<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebAudit Sec</title>
  <link rel="icon" type="image/png" href="/static/brand/logo-fuera.png">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<!-- Bordes para redimensionar la ventana sin marco (solo en la app de escritorio) -->
<div class="resize-handles" aria-hidden="true">
  <div data-edge="top"></div><div data-edge="bottom"></div>
  <div data-edge="left"></div><div data-edge="right"></div>
  <div data-edge="top-left"></div><div data-edge="top-right"></div>
  <div data-edge="bottom-left"></div><div data-edge="bottom-right"></div>
</div>

<!-- Barra de título: se arrastra para mover la ventana -->
<header class="titlebar" id="titlebar">
  <div class="brand">
    <img class="logo-mark" src="/static/brand/logo-fuera.png" alt="" draggable="false">
    <div>
      <div class="logo">WebAudit <span>Sec</span></div>
      <span class="brand-caption">WEB SECURITY AUDITOR</span>
    </div>
  </div>
  <div class="titlebar-actions">
    <button id="language" type="button">EN / ES</button>
    <div class="window-controls">
      <button type="button" id="windowMinimize" aria-label="Minimizar">
        <svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg>
      </button>
      <button type="button" id="windowMaximize" aria-label="Maximizar">
        <svg class="icon-maximize" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
        <svg class="icon-restore" viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V0.5h7v7h-2"/></svg>
      </button>
      <button type="button" id="windowClose" class="close" aria-label="Cerrar">
        <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="app-body">
<main>
  <!-- Formulario de análisis -->
  <section class="panel">
    <form id="scanForm">
      <div class="url-field">
        <label id="urlLabel" for="target"></label>
        <input id="target" type="url" placeholder="https://example.com" required>
      </div>
      <fieldset class="crawl-options">
        <legend id="crawlMode"></legend>
        <label>
          <input type="radio" name="crawl-mode" value="single" checked>
          <span id="singlePage"></span>
        </label>
        <label>
          <input type="radio" name="crawl-mode" value="multiple">
          <span id="linkedPages"></span>
        </label>
      </fieldset>
      <button class="primary" id="scanButton" type="submit"></button>
      <button class="cancel" id="cancelButton" type="button" hidden></button>
    </form>

    <!-- Progreso en vivo mientras se analiza -->
    <div class="progress" id="progressPanel" hidden>
      <div class="progress-head">
        <strong id="progressText"></strong>
        <span id="progressMeta"></span>
      </div>
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div class="progress-current" id="progressCurrent"></div>
    </div>

    <p id="notice"></p>
  </section>

  <!-- Resumen -->
  <section class="stats stats-row">
    <div class="stat"><span id="statusLabel"></span><strong id="statusValue">—</strong></div>
    <div class="stat"><span id="httpLabel"></span><strong id="httpValue">—</strong></div>
    <div class="stat"><span id="findingsLabel"></span><strong id="findingsValue">—</strong></div>
  </section>

  <section class="stats severities stats-row">
    <div class="stat"><span id="highLabel"></span><strong id="highValue">—</strong></div>
    <div class="stat"><span id="mediumLabel"></span><strong id="mediumValue">—</strong></div>
    <div class="stat"><span id="lowLabel"></span><strong id="lowValue">—</strong></div>
    <div class="stat"><span id="infoLabel"></span><strong id="infoValue">—</strong></div>
  </section>

  <!-- Todas las comprobaciones -->
  <section class="panel">
    <h2 id="checksTitle"></h2>
    <p id="checksDescription"></p>
    <div class="stats">
      <div class="stat"><span id="checksPassLabel"></span><strong id="checksPass">—</strong></div>
      <div class="stat"><span id="checksWarningLabel"></span><strong id="checksWarning">—</strong></div>
      <div class="stat"><span id="checksUnknownLabel"></span><strong id="checksUnknown">—</strong></div>
    </div>
    <div id="checksList"></div>
  </section>

  <details class="methodology">
    <summary id="severityDisclaimerLabel"></summary>
    <p id="severityDisclaimer"></p>
  </details>

  <!-- Hallazgos por página -->
  <section class="panel">
    <h2 id="resultsTitle"></h2>
    <div id="results">
      <p id="empty"></p>
    </div>
  </section>
</main>
</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/i18n-scanner.js"></script>
<script src="/static/js/window.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
